services:
  painel:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      DATABASE_PATH: /app/data/auction_monitor.sqlite3
    volumes:
      - leilao-data:/app/data
    restart: unless-stopped
volumes:
  leilao-data:
